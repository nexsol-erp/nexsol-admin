name: Weighbridge app

# Separate from deploy.yml so a weighbridge build problem never blocks the admin deploy.
on:
  push:
    branches: [main]
    paths:
      - 'weighbridge-electron/**'
      - '.github/workflows/weighbridge.yml'
  pull_request:
    paths:
      - 'weighbridge-electron/**'
      - '.github/workflows/weighbridge.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: weighbridge-electron

jobs:
  # ── Indicator parser, charging rule, local store, sync ─────────────────────
  test:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: weighbridge-electron/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # ── Windows installer ──────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    needs: [test]
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: weighbridge-electron/package-lock.json

      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - run: npm ci

      # electron-builder rebuilds better-sqlite3 and serialport for Electron before packing.
      - name: Build installer
        run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: weighbridge-installer
          path: weighbridge-electron/release/TradeLink247-Weighbridge-Setup-*.exe
          retention-days: 14

  # ── Publish to the server (main only, when deploy secrets are set) ─────────
  # The backend serves it at /api/updates/weighbridge/download from weighbridge.app.dir,
  # and the web /download page links there. Same secrets as deploy.yml.
  publish:
    runs-on: ubuntu-latest
    needs: [build-windows]
    # Off: the Slint app (weighbridge-slint.yml) publishes to the same folder now, and a 1.x
    # Electron build must never replace it. Kept for reference.
    if: false
    defaults:
      run:
        working-directory: .
    env:
      WB_DIR: ${{ vars.WEIGHBRIDGE_APP_DIR || '/home/deploy/tradelink-pos/weighbridge' }}
      VERSION: ${{ needs.build-windows.outputs.version }}
    steps:
      - name: Check deploy secrets
        id: can
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_NAME: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$HOST" ] || [ -z "$USER_NAME" ] || [ -z "$KEY" ]; then echo "::warning::Deploy secrets not set; skipping publish."; exit 0; fi
          echo "deploy=true" >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v4
        if: steps.can.outputs.deploy == 'true'
        with:
          name: weighbridge-installer
          path: out/

      - name: Make the folder on the server
        if: steps.can.outputs.deploy == 'true'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: mkdir -p ${{ env.WB_DIR }}

      - name: Copy the installer
        if: steps.can.outputs.deploy == 'true'
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "out/TradeLink247-Weighbridge-Setup-${{ env.VERSION }}.exe"
          target: "${{ env.WB_DIR }}/"
          strip_components: 1
          overwrite: true

      # latest.txt goes last, so the download link never points at a half-copied file.
      - name: Point latest.txt at it
        if: steps.can.outputs.deploy == 'true'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            chmod 644 "${{ env.WB_DIR }}/TradeLink247-Weighbridge-Setup-${{ env.VERSION }}.exe"
            echo "${{ env.VERSION }}" > ${{ env.WB_DIR }}/latest.txt
            ls -lh ${{ env.WB_DIR }}
