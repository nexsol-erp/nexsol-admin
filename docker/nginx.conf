# Serves the built admin SPA inside the container. TLS and routing of /api, /ws and /updates
# happen in the stack's Caddy in front of this, not here.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Fingerprinted build assets can be cached forever.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # POS installers, mounted from the host (see nexsol-deploy).
    location /downloads/ {
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Everything else is a client-side route. index.html must never be cached, or users keep
    # an old build after a deploy.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
