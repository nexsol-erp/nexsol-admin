[package]
name = "weighbridge-slint"
version = "3.0.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
chrono = "0.4.45"
dirs = "7.0.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
log = "0.4.34"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "native-tls", "system-proxy", "charset"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serialport = "4.10.1"
slint = "1.18.1"
uuid = { version = "1.26.1", features = ["v4"] }

[build-dependencies]
slint-build = "1.18.1"

[target."cfg(windows)".dependencies]
rfd = "0.15"
windows-service = "0.8.1"
nokhwa = { version = "0.10.11", default-features = false, features = ["input-msmf"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_Storage_Xps", "Win32_System_Threading", "Win32_Security", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
strip = true
opt-level = "s"
lto = "thin"
codegen-units = 1
