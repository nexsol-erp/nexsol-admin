[package]
name = "weighbridge-slint"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
chrono = "0.4.45"
dirs = "7.0.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
log = "0.4.34"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "native-tls", "system-proxy", "charset"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serialport = "4.10.1"
slint = "1.18.1"
uuid = { version = "1.26.1", features = ["v4"] }

[build-dependencies]
slint-build = "1.18.1"
